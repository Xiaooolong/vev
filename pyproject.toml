[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vev-ai"
dynamic = ["version"]
description = "Jev-like decision models that can also see images, served behind a /v1/systemone-compatible API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Xiaolong Wang" }]
keywords = ["llm", "classification", "calibration", "vision-language", "qwen", "system-one"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.8",
  "torchvision>=0.23",
  "flash-linear-attention==0.5.2; sys_platform == 'linux'",
  "transformers>=5.17,<5.18",
  "peft>=0.21,<0.22",
  "accelerate>=1.10",
  "huggingface_hub>=1.0",
  "safetensors>=0.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pillow>=10",
]

[project.optional-dependencies]
train = ["datasets>=3.0", "pyarrow>=16", "imagehash>=4.3", "datasketch>=1.6", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
vev = "vev.cli:main"

[project.urls]
Homepage = "https://github.com/Xiaooolong/vev"
Models = "https://huggingface.co/CountingSheep"
Issues = "https://github.com/Xiaooolong/vev/issues"

[tool.hatch.version]
path = "vev/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vev"]

[tool.hatch.build.targets.sdist]
include = ["vev", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["evals/tests", "train/tests", "data/tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B905", "B007"]
